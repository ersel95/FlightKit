name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: scripts/build-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Compute checksum
        id: sum
        run: |
          DMG="dist/FlightKit-${{ steps.ver.outputs.version }}.dmg"
          echo "sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SHA="${{ steps.sum.outputs.sha256 }}"
          sed -i '' -E "s/version \".*\"/version \"$VERSION\"/" Casks/flightkit.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/flightkit.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/flightkit.rb
          git commit -m "chore: cask -> $VERSION" || echo "no cask change"
          git push origin HEAD:${GITHUB_REF_NAME%%/*} || git push origin HEAD:main || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlightKit-${{ steps.ver.outputs.version }}.dmg
          generate_release_notes: true
